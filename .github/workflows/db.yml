name: Banco (migrações)

# Manual: Actions → "Banco (migrações)" → Run workflow.
# Comece com dry_run ligado para ver o que seria aplicado.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Só listar o que seria aplicado, sem alterar o banco"
        type: boolean
        default: true

jobs:
  aplicar:
    runs-on: ubuntu-latest
    environment: producao
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - run: npx supabase migration list
      - name: Aplicar migrações
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npx supabase db push --dry-run
          else
            npx supabase db push
          fi
